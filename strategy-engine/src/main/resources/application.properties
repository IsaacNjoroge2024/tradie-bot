server.port=8081

spring.application.name=strategy-engine

# Keep servlet mode when spring-webflux is on the classpath
spring.main.web-application-type=servlet

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tradie}
spring.datasource.username=${DB_USER:tradie}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka - consumer/producer details are configured in KafkaConfig.java
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache (Caffeine) - used to cache News Shield responses and account info
spring.cache.type=caffeine
spring.cache.cache-names=marketStatus,accountInfo
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=500

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Strategy Engine configuration
tradie.strategy.kill-zone-strict-mode=false
tradie.strategy.signal-expiry-seconds=300
tradie.strategy.max-concurrent-positions=5

# Risk management
tradie.risk.max-risk-per-trade-pct=2.0
tradie.risk.max-daily-loss-pct=3.0
tradie.risk.max-portfolio-heat-pct=6.0
tradie.risk.min-risk-reward-ratio=2.0
tradie.risk.losing-streak-threshold=3
tradie.risk.losing-streak-size-reduction=0.5
tradie.risk.default-account-balance=${ACCOUNT_BALANCE:10000.0}

# News Shield
tradie.news-shield.base-url=${NEWS_SHIELD_URL:http://localhost:8001}
tradie.news-shield.timeout-ms=5000

# Position sizing
tradie.position-sizing.default-method=FIXED_FRACTIONAL
tradie.position-sizing.risk-per-trade-pct=2.0
tradie.position-sizing.max-position-pct=10.0

# Kelly Criterion
tradie.kelly.fraction=0.25
tradie.kelly.min-trades-required=30
tradie.kelly.lookback-days=90

# ATR-based sizing
tradie.atr.default-multiplier=2.0
tradie.atr.scalping-multiplier=1.5
tradie.atr.swing-multiplier=2.5

# Portfolio heat thresholds
tradie.portfolio.max-heat-pct=${tradie.risk.max-portfolio-heat-pct}
tradie.portfolio.warning-heat-pct=4.0
tradie.portfolio.reduce-heat-pct=5.0
tradie.portfolio.max-correlated-exposure=3.0

# Technical indicators (ta4j)
tradie.indicators.rsi-period=14
tradie.indicators.rsi-overbought=70.0
tradie.indicators.rsi-oversold=30.0
tradie.indicators.macd-fast=12
tradie.indicators.macd-slow=26
tradie.indicators.macd-signal=9
tradie.indicators.adx-period=14
tradie.indicators.adx-trending-threshold=25.0
tradie.indicators.atr-period=14
tradie.indicators.bb-period=20
tradie.indicators.bb-std-dev=2.0
tradie.indicators.volume-sma-period=20
tradie.indicators.default-lookback-bars=250
tradie.indicators.default-timeframe=1H
tradie.indicators.default-exchange=NASDAQ
tradie.indicators.divergence-lookback=20

# Signal confirmation
tradie.confirmation.enabled=true
tradie.confirmation.min-confirmations=2
tradie.confirmation.divergence-boost-pct=15.0

# Logging
logging.level.com.tradie=INFO
logging.level.org.springframework.kafka=INFO
