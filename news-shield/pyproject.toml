[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-shield"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "nltk>=3.8.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
# Heavy ML deps installed separately from CI to avoid timeouts
ml = [
    "transformers>=4.36.0",
    "torch>=2.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9/F) plus bugbear (B) and ruff-specific (RUF) checks.
# Import sorting (I) deliberately left off — would reorder imports across the
# whole existing codebase in one shot rather than as reviewed, incremental changes.
select = ["E4", "E7", "E9", "F", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires Query()/Depends()/Path()/Body()
# as argument defaults — that's not the mutable-default-argument bug B008 targets.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]
