server.port=8082

spring.application.name=order-executor

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tradie}
spring.datasource.username=${DB_USER:tradie}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=order-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tradie.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Interactive Brokers
tradie.ibkr.host=${IB_HOST:127.0.0.1}
tradie.ibkr.port=${IB_PORT:7497}
tradie.ibkr.client-id=${IB_CLIENT_ID:1}
tradie.ibkr.connection-timeout-seconds=30
tradie.ibkr.heartbeat-interval-seconds=30
tradie.ibkr.heartbeat-timeout-seconds=90
tradie.ibkr.max-reconnect-attempts=10
tradie.ibkr.account-refresh-seconds=60

# Logging
logging.level.com.tradie=INFO
logging.level.com.ib.client=WARN
