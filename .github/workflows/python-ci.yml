name: Python CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'news-shield/**'
      - 'backtesting-service/**'
      - 'tradie-mt5-bridge/**'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'news-shield/**'
      - 'backtesting-service/**'
      - 'tradie-mt5-bridge/**'
      - '.github/workflows/python-ci.yml'

jobs:
  test-news-shield:
    name: Test and Lint News Shield
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-shield

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: news-shield/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v

  test-mt5-bridge:
    name: Test and Lint MT5 Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradie-mt5-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tradie-mt5-bridge/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check app/ tests/

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Run tests
        run: pytest tests/ -v

  test-backtesting-service:
    name: Test and Lint Backtesting Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backtesting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtesting-service/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v
