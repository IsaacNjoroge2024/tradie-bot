server.port=8082

spring.application.name=order-executor

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tradie}
spring.datasource.username=${DB_USER:tradie}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=order-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tradie.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Interactive Brokers
tradie.ibkr.host=${IB_HOST:127.0.0.1}
tradie.ibkr.port=${IB_PORT:7497}
tradie.ibkr.client-id=${IB_CLIENT_ID:1}
tradie.ibkr.connection-timeout-seconds=30
tradie.ibkr.heartbeat-interval-seconds=30
tradie.ibkr.heartbeat-timeout-seconds=90
tradie.ibkr.max-reconnect-attempts=10
tradie.ibkr.account-refresh-seconds=60

# Kafka Topics
tradie.kafka.topics.alerts=tradie.alerts
tradie.kafka.topics.orders-dlq=tradie.orders.dlq

# Order Execution
tradie.orders.default-order-type=LMT
tradie.orders.use-stop-limit=false
tradie.orders.stop-limit-offset=0.10
tradie.orders.order-timeout-seconds=300
tradie.orders.cancel-unfilled-after-seconds=3600
tradie.orders.bracket-enabled=true
tradie.orders.stop-loss-required=true
tradie.orders.take-profit-required=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Position Management
tradie.positions.sync-interval-ms=300000
tradie.positions.price-update-interval-ms=1000

# Trailing Stop
tradie.trailing-stop.enabled=true
tradie.trailing-stop.default-trail-pct=2.0
tradie.trailing-stop.activation-pct=1.0
tradie.trailing-stop.step-pct=0.25

# Break-Even
tradie.break-even.enabled=true
tradie.break-even.activation-pct=1.0

# Logging
logging.level.com.tradie=INFO
logging.level.com.ib.client=WARN
