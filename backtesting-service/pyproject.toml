[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtesting-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "asyncpg>=0.29.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "plotly>=5.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Heavy backtesting engines — install separately from CI to avoid timeouts
backtesting = [
    "vectorbt>=0.26.1",
    "backtrader>=1.9.78.123",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.28.0",
    "black>=24.1.0",
    "ruff>=0.6.0",
    "yfinance>=0.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9/F) plus bugbear (B) and ruff-specific (RUF) checks —
# the categories that caught real issues in review (unsorted __all__, unused
# f-string). Import sorting (I) is deliberately left off for now: enabling it
# would reorder imports across the whole existing codebase in one shot rather
# than as reviewed, incremental changes.
select = ["E4", "E7", "E9", "F", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires Query()/Depends()/Path()/Body()
# as argument defaults — that's not the mutable-default-argument bug B008 targets.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]
