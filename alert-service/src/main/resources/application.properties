server.port=8083

spring.application.name=alert-service

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tradie}
spring.datasource.username=${DB_USER:tradie}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Telegram
tradie.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
tradie.telegram.chat-id=${TELEGRAM_CHAT_ID:}
tradie.telegram.enabled=${TELEGRAM_ENABLED:true}

tradie.telegram.alerts.trade-entry=true
tradie.telegram.alerts.trade-exit=true
tradie.telegram.alerts.signal-rejected=true
tradie.telegram.alerts.system-alerts=true

tradie.telegram.throttling.max-per-minute=10
tradie.telegram.throttling.aggregate-similar=true

tradie.telegram.summary.enabled=true
tradie.telegram.summary.timezone=America/New_York
tradie.telegram.summary.cron=0 0 17 * * MON-FRI
tradie.telegram.parse-mode=MarkdownV2
tradie.order-executor.url=${ORDER_EXECUTOR_URL:http://localhost:8082}

# Logging
logging.level.com.tradie=INFO
