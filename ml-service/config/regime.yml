regime:
  n_regimes: 4
  lookback_periods: 252
  update_frequency_hours: 4

  # Applied to each HMM state's mean *raw* (unscaled) feature values — see
  # HMMRegimeDetector._map_regimes_to_states for why raw values are used
  # instead of the standardized features the HMM itself is fit on.
  # trending_return is annualized (see _calculate_features) so it's
  # comparable across timeframes, not a raw 5-bar % move.
  thresholds:
    trending_return: 0.756     # 1.5% raw 5-bar return, annualized at 1D's 252 bars/year
    volatile_volatility: 0.35  # 35% annualized realized volatility

  recommendations:
    trending_up:
      position_multiplier: 1.0
      stop_multiplier: 1.2
    trending_down:
      position_multiplier: 0.75
      stop_multiplier: 1.0
    ranging:
      position_multiplier: 0.8
      stop_multiplier: 0.8
    volatile:
      position_multiplier: 0.5
      stop_multiplier: 1.5
